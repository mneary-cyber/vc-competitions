<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | Vouchercloud</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>:root { --brand: {{brand_color}}; }</style>
</head>
<body>
  <header class="site-header">
    <a href="https://www.vouchercloud.com">
      <img src="/images/vc-logo.svg" alt="Vouchercloud" class="logo">
    </a>
  </header>
  <main class="comp-hero">
    <div class="comp-content" style="text-align:center;padding:60px 20px">
      <span class="comp-badge">Competition closed</span>
      <h1>{{title}}</h1>
      <p>This competition has now closed. Thanks to everyone who entered!</p>
      <a href="https://www.vouchercloud.com" class="btn-enter" style="display:inline-block;margin-top:24px;text-decoration:none">Browse latest deals</a>
    </div>
  </main>
</body>
</html>
